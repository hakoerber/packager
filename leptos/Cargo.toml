[package]
name = "packager-leptos"
version = "0.1.0"
edition = "2021"

[package.metadata.leptos]
output-name = "packager-leptos"

site-root = "target/site"
site-pkg-dir = "pkg"

assets-dir = "public"

site-addr = "127.0.0.1:3000"
reload-port = 3001

# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "DEV"

bin-features = [
    "ssr",
]
bin-default-features = false

lib-features = [
    "hydrate",
]
lib-default-features = false
lib-profile-release = "wasm-release"

[lib]
crate-type = [
    "cdylib",
    "rlib",
]

[dependencies.axum]
version = "0.8.0"
default-features = false
optional = true

[dependencies.axum-prometheus]
version = "*"
default-features = false
features = [
    "prometheus",
]
optional = true

[dependencies.clap]
version = "*"
default-features = false
features = [
    "derive",
    "help",
    "std",
]
optional = true

[dependencies.console_error_panic_hook]
version = "0.1"
default-features = false
optional = true

[dependencies.console-subscriber]
version = "*"
default-features = false
optional = true

[dependencies.database]
package = "packager-database"
path = "../database"
optional = true

[dependencies.futures]
version = "*"
default-features = false
optional = true

[dependencies.http]
version = "*"
default-features = false
optional = true

[dependencies.hyper]
version = "*"
default-features = false
features = [
    "full",
]
optional = true

[dependencies.leptos]
version = "0.8.0"
default-features = false

[dependencies.leptos_axum]
version = "0.8.0"
default-features = false
features = [
    "default",
]
optional = true

[dependencies.leptos_meta]
version = "0.8.0"
default-features = false

[dependencies.leptos_router]
version = "0.8.0"
default-features = false

[dependencies.metrics]
version = "*"
default-features = false
optional = true

[dependencies.opentelemetry]
version = "*"
default-features = false
optional = true

[dependencies.opentelemetry-otlp]
version = "*"
default-features = false
features = [
    "grpc-tonic",
    "trace",
]
optional = true

[dependencies.opentelemetry_sdk]
version = "*"
default-features = false
features = [
    "rt-tokio",
    "trace",
]
optional = true

[dependencies.paste]
version = "*"
default-features = false

[dependencies.serde]
version = "*"
default-features = false
features = [
    "derive",
]
# optional = true

[dependencies.sqlx]
version = "*"
default-features = false
features = [
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio-rustls",
    "time",
    "uuid",
]
optional = true

[dependencies.time]
version = "*"
default-features = false
features = [
    "serde",
]

[dependencies.tokio]
version = "1"
default-features = false
features = [
    "rt-multi-thread",
]
optional = true

[dependencies.tonic]
version = "*"
default-features = false
optional = true

[dependencies.tower-http]
version = "*"
default-features = false
features = [
    "request-id",
    "trace",
]
optional = true

[dependencies.tracing]
version = "*"
default-features = false
optional = true

[dependencies.tracing-log]
version = "*"
default-features = false
features = [
    "log-tracer",
    "std",
]
optional = true

[dependencies.tracing-opentelemetry]
version = "*"
default-features = false
optional = true

[dependencies.tracing-subscriber]
version = "*"
default-features = false
features = [
    "ansi",
    "env-filter",
    "json",
]
optional = true

[dependencies.uuid]
version = "*"
default-features = false
features = [
    "js",
    "serde",
    "v4",
]

[dependencies.wasm-bindgen]
version = "0.2.106"
default-features = false
optional = true

[features]
hydrate = [
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",

    "leptos/hydrate",
]

ssr = [
    "dep:axum",
    "dep:axum-prometheus",
    "dep:clap",
    "dep:console-subscriber",
    "dep:database",
    "dep:futures",
    "dep:http",
    "dep:hyper",
    "dep:leptos_axum",
    "dep:metrics",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:sqlx",
    "dep:tokio",
    "dep:tonic",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-log",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",

    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
